[package]
name = "jjk-fighter"
version = "1.0.0"
description = "咒术回战 呪術激闘"
authors = ["FengXin"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
